<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar | autenticar</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script defer src="global-header.js"></script>
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-panel {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);
    }
  </style>
  <script>
    const apiBase = window.location.protocol === "file:" ? "http://127.0.0.1:3000" : "";
    async function apiFetch(path, options) {
      return window.AutenticarApi.fetch(`${apiBase}${path}`, options);
    }

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#002835",
            "primary-container": "#153e4d",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#011d35",
            "on-surface-variant": "#41484b",
            "outline-variant": "#c1c7cb",
            "secondary-container": "#153e4d"
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-browser.js"></script>
</head>
<body class="bg-surface text-on-surface overflow-x-hidden">
  <main class="min-h-[100dvh] relative">
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('hero-autenticar.png');"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-black/82 via-black/68 to-black/40"></div>

    <div class="relative z-10 w-full px-4 md:px-10 py-5 min-h-[100dvh] flex flex-col">
      <header class="flex items-center justify-between gap-3">
        <a href="index.html" aria-label="Voltar ao inicio" class="inline-flex items-center">
          <img alt="autenticar" class="h-9 md:h-10 w-auto" src="logo-new-3.png"/>
        </a>
        <div class="hidden md:flex items-center gap-7 text-white/95 text-xs font-semibold">
          <a class="py-1 transition-colors hover:text-white" href="index.html">Inicio</a>
          <a class="py-1 transition-colors hover:text-white" href="index.html#stock">Stock</a>
          <a class="py-1 transition-colors hover:text-white" href="about-us.html">Quem somos</a>
        </div>
      </header>

      <section class="flex-1 flex items-center justify-center py-6 md:py-0">
          <div class="glass-panel w-full max-w-[560px] rounded-2xl p-5 md:p-8 text-white">
            <h2 class="text-3xl font-extrabold mb-2">Entrar</h2>
            <p class="text-white/80 mb-6">Use o seu email e palavra-passe para continuar.</p>

          <form class="space-y-4" id="loginForm">
            <div>
              <label class="block text-sm font-semibold mb-2" for="loginEmail">Email</label>
              <input id="loginEmail" type="email" placeholder="nome@email.com" required class="w-full h-12 rounded-lg border border-white/40 bg-white/95 text-on-surface px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2" for="loginPassword">Palavra-passe</label>
              <input id="loginPassword" type="password" placeholder="????????" required class="w-full h-12 rounded-lg border border-white/40 bg-white/95 text-on-surface px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
            </div>
            <div class="flex items-center justify-between text-sm">
              <label class="flex items-center gap-2 cursor-pointer text-white/85">
                <input type="checkbox" class="rounded border-white/50 text-primary focus:ring-primary"/>
                <span>Lembrar sessão</span>
              </label>
              <a href="#" class="font-semibold text-white hover:underline">Esqueceu-se?</a>
            </div>
            <button type="submit" class="w-full h-12 rounded-lg bg-primary-container text-white font-extrabold hover:opacity-90 transition-opacity">
              Entrar
            </button>
          </form>

          <form class="space-y-4 hidden mt-6" id="registerForm">
            <div>
              <label class="block text-sm font-semibold mb-2" for="registerName">Nome</label>
              <input id="registerName" type="text" placeholder="O seu nome" class="w-full h-12 rounded-lg border border-white/40 bg-white/95 text-on-surface px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2" for="registerEmail">Email</label>
              <input id="registerEmail" type="email" placeholder="nome@email.com" class="w-full h-12 rounded-lg border border-white/40 bg-white/95 text-on-surface px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2" for="registerPassword">Palavra-passe</label>
              <input id="registerPassword" type="password" placeholder="m?nimo 8 caracteres" class="w-full h-12 rounded-lg border border-white/40 bg-white/95 text-on-surface px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
            </div>
            <button type="submit" class="w-full h-12 rounded-lg bg-white text-primary font-extrabold hover:bg-white/90 transition-colors">
              Criar conta
            </button>
          </form>

          <p id="statusMessage" class="text-sm mt-4"></p>

            <p class="text-sm text-white/85 mt-5">
              Ainda não tem conta?
              <a href="#" id="showRegister" class="text-white font-bold hover:underline">Criar conta</a>
            </p>
          </div>
      </section>
    </div>
  </main>

  <script>
    const showRegisterLink = document.getElementById("showRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const statusMessage = document.getElementById("statusMessage");

    function setMessage(text, type = "neutral") {
      const classes = {
        neutral: "text-white/85",
        success: "text-green-300",
        error: "text-red-300"
      };
      statusMessage.className = `text-sm mt-4 ${classes[type] || classes.neutral}`;
      statusMessage.textContent = text;
    }

    async function redirectIfSessionExists() {
      const sessionRaw = localStorage.getItem("autenticar_session_v1");
      if (!sessionRaw) return;

      let session;
      try {
        session = JSON.parse(sessionRaw);
      } catch {
        localStorage.removeItem("autenticar_session_v1");
        localStorage.removeItem("autenticar_user_v1");
        return;
      }

      if (!session?.access_token) return;

      try {
        const response = await apiFetch("/api/auth/session-info", {
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        const data = await response.json();

        if (!response.ok || !data.ok || !data.user) {
          localStorage.removeItem("autenticar_session_v1");
          localStorage.removeItem("autenticar_user_v1");
          return;
        }

        localStorage.setItem("autenticar_user_v1", JSON.stringify(data.user));
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        if (next) {
          window.location.href = next;
          return;
        }
        window.location.href = data.user.is_admin ? "admin.html" : "area-cliente.html";
      } catch {
        // keep user on login page if network fails
      }
    }

    async function routeBySession(session, nextUrl = null) {
      if (!session?.access_token) {
        window.location.href = "area-cliente.html";
        return;
      }
      const response = await apiFetch("/api/auth/session-info", {
        headers: { Authorization: `Bearer ${session.access_token}` }
      });
      const data = await response.json();
      if (!response.ok || !data.ok || !data.user) {
        localStorage.removeItem("autenticar_session_v1");
        localStorage.removeItem("autenticar_user_v1");
        window.location.href = "login.html";
        return;
      }
      localStorage.setItem("autenticar_user_v1", JSON.stringify(data.user));
      if (nextUrl) {
        window.location.href = nextUrl;
        return;
      }
      window.location.href = data.user.is_admin ? "admin.html" : "area-cliente.html";
    }

    showRegisterLink.addEventListener("click", function (e) {
      e.preventDefault();
      loginForm.classList.toggle("hidden");
      registerForm.classList.toggle("hidden");
      showRegisterLink.textContent = registerForm.classList.contains("hidden") ? "Criar conta" : "Voltar ao login";
      setMessage("");
    });

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      setMessage("A iniciar sess?o...");

      try {
        const response = await apiFetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          setMessage(data.message || "Não foi possível iniciar sessão.", "error");
          return;
        }

        if (data.session?.access_token) {
          localStorage.setItem("autenticar_session_v1", JSON.stringify(data.session));
        }
        if (data.user) {
          localStorage.setItem("autenticar_user_v1", JSON.stringify(data.user));
        }

        setMessage("Sessão iniciada com sucesso. A redirecionar...", "success");
        setTimeout(async () => {
          const params = new URLSearchParams(window.location.search);
          const next = params.get("next");
          await routeBySession(data.session, next);
        }, 700);
      } catch (_err) {
        setMessage("Erro de liga??o ao servidor.", "error");
      }
    });

    registerForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("registerName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;

      setMessage("A criar conta...");

      try {
        const response = await apiFetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          setMessage(data.message || "Não foi possível criar conta.", "error");
          return;
        }

        registerForm.reset();
        setMessage(data.message || "Conta criada com sucesso. J? pode entrar.", "success");
      } catch (_err) {
        setMessage("Erro de liga??o ao servidor.", "error");
      }
    });

    redirectIfSessionExists();
  </script>
</body>
</html>
