<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar | autenticar</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#002835",
            "primary-container": "#153e4d",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#011d35",
            "on-surface-variant": "#41484b",
            "outline-variant": "#c1c7cb"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface overflow-x-hidden">
  <header class="w-full h-16 sticky top-0 z-50 border-b border-white/10 bg-[#153E4D]">
    <div class="max-w-[1280px] mx-auto h-full px-4 md:px-10 flex justify-between items-center">
      <a href="index.html" class="flex items-center">
        <img alt="autenticar" class="h-8 md:h-10 w-auto" src="Logo.png"/>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a class="text-white font-bold px-2 py-1 rounded-lg hover:bg-white/10 transition-colors" href="index.html">Início</a>
        <a class="text-white font-bold px-2 py-1 rounded-lg hover:bg-white/10 transition-colors" href="#">Comprar</a>
        <a class="text-white font-bold px-2 py-1 rounded-lg hover:bg-white/10 transition-colors" href="#">Vender</a>
      </nav>
      <a href="login.html" class="hidden md:flex items-center gap-2 bg-primary-container text-white px-4 py-2 rounded-full">
        <span class="material-symbols-outlined text-[20px]">person</span>
        <span class="font-bold text-sm">Entrar / Registar</span>
      </a>
      <span class="material-symbols-outlined md:hidden text-white">person</span>
    </div>
  </header>

  <main class="min-h-[calc(100dvh-4rem)] flex items-center justify-center px-4 py-10">
    <section class="w-full max-w-[980px] grid md:grid-cols-2 rounded-2xl overflow-hidden shadow-xl border border-outline-variant/60 bg-surface-container-lowest">
      <div class="hidden md:flex flex-col justify-between p-10 bg-primary-container text-white">
        <div>
          <p class="uppercase tracking-[0.18em] text-xs text-white/70 mb-3">Bem-vindo</p>
          <h1 class="text-4xl font-extrabold leading-tight mb-4">Entre na sua conta autenticar</h1>
          <p class="text-white/85">Gerencie anúncios, favoritos e propostas num só lugar.</p>
        </div>
        <p class="text-sm text-white/65">© 2024 autenticar</p>
      </div>

      <div class="p-6 md:p-10">
        <h2 class="text-3xl font-extrabold text-primary mb-2">Entrar</h2>
        <p class="text-on-surface-variant mb-6">Use o seu email e palavra-passe para continuar.</p>

        <form class="space-y-4" id="loginForm">
          <div>
            <label class="block text-sm font-bold mb-2">Email</label>
            <input type="email" placeholder="nome@email.com" class="w-full h-12 rounded-lg border border-outline-variant px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">Palavra-passe</label>
            <input type="password" placeholder="••••••••" class="w-full h-12 rounded-lg border border-outline-variant px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="rounded border-outline-variant text-primary focus:ring-primary"/>
              <span>Lembrar sessão</span>
            </label>
            <a href="#" class="text-primary font-semibold hover:underline">Esqueceu-se?</a>
          </div>
          <button type="submit" class="w-full h-12 rounded-lg bg-primary-container text-white font-bold hover:opacity-90 transition-opacity">
            Entrar
          </button>
        </form>

        <form class="space-y-4 hidden mt-6" id="registerForm">
          <div>
            <label class="block text-sm font-bold mb-2">Nome</label>
            <input id="registerName" type="text" placeholder="O seu nome" class="w-full h-12 rounded-lg border border-outline-variant px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">Email</label>
            <input id="registerEmail" type="email" placeholder="nome@email.com" class="w-full h-12 rounded-lg border border-outline-variant px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">Palavra-passe</label>
            <input id="registerPassword" type="password" placeholder="mínimo 8 caracteres" class="w-full h-12 rounded-lg border border-outline-variant px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none"/>
          </div>
          <button type="submit" class="w-full h-12 rounded-lg bg-primary-container text-white font-bold hover:opacity-90 transition-opacity">
            Criar conta
          </button>
        </form>

        <p id="registerMessage" class="text-sm mt-4"></p>

        <p class="text-sm text-on-surface-variant mt-5">
          Ainda não tem conta?
          <a href="#" id="showRegister" class="text-primary font-bold hover:underline">Criar conta</a>
        </p>
      </div>
    </section>
  </main>
  <script>
    const showRegisterLink = document.getElementById("showRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const registerMessage = document.getElementById("registerMessage");

    showRegisterLink.addEventListener("click", function (e) {
      e.preventDefault();
      loginForm.classList.toggle("hidden");
      registerForm.classList.toggle("hidden");
      showRegisterLink.textContent = registerForm.classList.contains("hidden") ? "Criar conta" : "Voltar ao login";
      registerMessage.textContent = "";
    });

    registerForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("registerName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;

      registerMessage.className = "text-sm mt-4 text-on-surface-variant";
      registerMessage.textContent = "A criar conta...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();
        if (!response.ok || !data.ok) {
          registerMessage.className = "text-sm mt-4 text-red-600";
          registerMessage.textContent = data.message || "Não foi possível criar conta.";
          return;
        }

        registerMessage.className = "text-sm mt-4 text-green-700";
        registerMessage.textContent = "Conta criada com sucesso. Já pode entrar.";
        registerForm.reset();
      } catch (_err) {
        registerMessage.className = "text-sm mt-4 text-red-600";
        registerMessage.textContent = "Erro de ligação ao servidor.";
      }
    });
  </script>
</body>
</html>
