<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz de Recomendação | Autenticar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="global-header.js?v=20260611-spacing"></script>
  <style>
    body { font-family: Montserrat, sans-serif; }
    .fade-enter { opacity: 0; transform: translateX(20px); }
    .fade-enter-active { opacity: 1; transform: translateX(0); transition: all 320ms ease; }
    .fade-exit { opacity: 1; transform: translateX(0); }
    .fade-exit-active { opacity: 0; transform: translateX(-20px); transition: all 260ms ease; }
    .glass { backdrop-filter: blur(14px); background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08)); border: 1px solid rgba(255,255,255,0.3); }
  </style>
</head>
<body class="min-h-screen bg-[#0f1b21] text-white">
  <main class="relative min-h-screen overflow-hidden">
    <div class="absolute inset-0 bg-cover bg-center" style="background-image:url('hero-autenticar.png')"></div>
    <div class="absolute inset-0 bg-black/60"></div>

    <div class="relative z-10 max-w-4xl mx-auto px-4 py-6">
      <header class="flex items-center justify-between gap-3 mb-8">
        <a href="index.html" aria-label="Voltar ao inicio" class="inline-flex items-center">
          <img src="logo-new-3.png" alt="autenticar" class="h-10 md:h-12 w-auto"/>
        </a>
        <div class="hidden md:flex items-center gap-7 text-white/95 text-xs font-semibold">
          <a class="py-1 transition-colors hover:text-white" href="index.html">Inicio</a>
          <a class="py-1 transition-colors hover:text-white" href="index.html#stock">Stock</a>
          <a class="py-1 transition-colors hover:text-white" href="about-us.html">Quem somos</a>
        </div>
      </header>

      <section class="glass rounded-3xl p-5 md:p-8 shadow-2xl">
        <div class="mb-4">
          <p class="text-white/80 text-sm">A estrada começa aqui.</p>
          <h1 class="text-3xl md:text-5xl font-black leading-tight">Descubra o carro ideal para si</h1>
        </div>
        <div class="mb-4">
          <div class="h-2 bg-white/20 rounded-full overflow-hidden">
            <div id="progress" class="h-full bg-white rounded-full" style="width: 6.66%"></div>
          </div>
          <p id="step-label" class="text-sm text-white/75 mt-2">Pergunta 1 de 15</p>
        </div>

        <div id="question-card" class="min-h-[190px]"></div>

        <div class="flex items-center justify-between mt-6">
          <button id="prev-btn" class="rounded-full border border-white/40 px-5 h-11 font-semibold disabled:opacity-40" disabled>Anterior</button>
          <button id="next-btn" class="rounded-full bg-white text-[#111] px-6 h-11 font-bold">Seguinte</button>
        </div>

        <div id="result" class="hidden mt-6 p-5 rounded-2xl bg-white text-[#153E4D]"></div>
      </section>
    </div>
  </main>

  <script>
    const questions = [
      { key: 'q_city', type: 'bool', text: 'Vai conduzir sobretudo em cidade?' },
      { key: 'q_family', type: 'bool', text: 'Precisa de muito espaço para família?' },
      { key: 'q_travel', type: 'bool', text: 'Faz viagens longas com frequência?' },
      { key: 'q_auto', type: 'bool', text: 'Prefere caixa automática?' },
      { key: 'q_suv', type: 'bool', text: 'Quer um carro mais alto (SUV)?' },
      { key: 'q_efficiency', type: 'range', text: 'Importância do consumo baixo (1-10)' },
      { key: 'q_performance', type: 'range', text: 'Importância da performance (1-10)' },
      { key: 'q_comfort', type: 'range', text: 'Conforto em autoestrada (1-10)' },
      { key: 'q_parking', type: 'range', text: 'Facilidade de estacionamento (1-10)' },
      { key: 'q_tech', type: 'range', text: 'Quanto valoriza tecnologia (1-10)' },
      { key: 'q_trunk', type: 'range', text: 'Importância de mala grande (1-10)' },
      { key: 'q_daily', type: 'range', text: 'Frequência de uso diário (1-10)' },
      { key: 'q_maintenance', type: 'range', text: 'Custos de manutenção baixos (1-10)' },
      { key: 'q_style', type: 'range', text: 'Importância de estilo/design (1-10)' },
      { key: 'q_budget', type: 'range', text: 'Sensibilidade ao preço (1-10)' }
    ];

    const answers = {};
    let step = 0;

    const card = document.getElementById('question-card');
    const progress = document.getElementById('progress');
    const stepLabel = document.getElementById('step-label');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const result = document.getElementById('result');

    function renderQuestion() {
      const q = questions[step];
      stepLabel.textContent = `Pergunta ${step + 1} de ${questions.length}`;
      progress.style.width = `${((step + 1) / questions.length) * 100}%`;
      prevBtn.disabled = step === 0;
      nextBtn.textContent = step === questions.length - 1 ? 'Ver recomendação' : 'Seguinte';

      const current = answers[q.key];
      const html = q.type === 'bool'
        ? `<div class="fade-enter"><h2 class="text-xl md:text-2xl font-bold mb-5">${q.text}</h2>
             <div class="flex gap-3">
               <button data-val="yes" class="ans-btn rounded-full px-6 h-12 border border-white/40 ${current === 'yes' ? 'bg-white text-[#111]' : 'text-white'}">Sim</button>
               <button data-val="no" class="ans-btn rounded-full px-6 h-12 border border-white/40 ${current === 'no' ? 'bg-white text-[#111]' : 'text-white'}">Não</button>
             </div></div>`
        : `<div class="fade-enter"><h2 class="text-xl md:text-2xl font-bold mb-5">${q.text}</h2>
             <input id="range-input" type="range" min="1" max="10" value="${current || 5}" class="w-full"/>
             <p class="mt-3 text-white/80">Valor: <strong id="range-value">${current || 5}</strong></p></div>`;

      card.className = 'min-h-[190px] fade-exit-active';
      setTimeout(() => {
        card.innerHTML = html;
        card.className = 'min-h-[190px] fade-enter-active';

        if (q.type === 'bool') {
          card.querySelectorAll('.ans-btn').forEach((b) => {
            b.addEventListener('click', () => {
              answers[q.key] = b.dataset.val;
              renderQuestion();
            });
          });
        } else {
          const input = document.getElementById('range-input');
          const valueEl = document.getElementById('range-value');
          input.addEventListener('input', () => { valueEl.textContent = input.value; answers[q.key] = Number(input.value); });
          answers[q.key] = Number(input.value);
        }
      }, 160);
    }

    function calc() {
      const yes = (k) => answers[k] === 'yes';
      const val = (k) => Number(answers[k] || 5);
      const score = { city: 0, family: 0, travel: 0, suv: 0, auto: 0, low: 0, budget: 0 };
      if (yes('q_city')) score.city += 3; else score.travel += 1;
      if (yes('q_family')) { score.family += 4; score.suv += 2; }
      if (yes('q_travel')) { score.travel += 4; score.auto += 1; }
      if (yes('q_auto')) score.auto += 4;
      if (yes('q_suv')) score.suv += 5;
      score.low += val('q_efficiency') + val('q_maintenance');
      score.budget += val('q_budget') + Math.max(0, 10 - val('q_performance'));
      score.travel += val('q_comfort') + Math.floor(val('q_daily') / 2);
      score.city += val('q_parking') + Math.floor(val('q_daily') / 2);
      score.family += val('q_trunk');
      score.suv += Math.floor(val('q_comfort') / 2) + Math.floor(val('q_trunk') / 2);
      score.auto += Math.floor(val('q_tech') / 2);

      const profiles = {
        city: { label: 'Carros para cidade', href: 'carros-cidade.html' },
        family: { label: 'Carros familiares', href: 'carros-familiares.html' },
        travel: { label: 'Carros para viagens', href: 'carros-viagens.html' },
        suv: { label: 'SUVs', href: 'suvs.html' },
        auto: { label: 'Carros automáticos', href: 'carros-automaticos.html' },
        low: { label: 'Baixo consumo', href: 'baixo-consumo.html' },
        budget: { label: 'Até 15.000€', href: 'ate-15000.html' }
      };
      const bestKey = Object.entries(score).sort((a, b) => b[1] - a[1])[0][0];
      return profiles[bestKey];
    }

    prevBtn.addEventListener('click', () => {
      if (step > 0) { step -= 1; renderQuestion(); }
    });

    nextBtn.addEventListener('click', () => {
      const q = questions[step];
      if (answers[q.key] === undefined) {
        if (q.type === 'bool') answers[q.key] = 'no';
        if (q.type === 'range') answers[q.key] = 5;
      }
      if (step < questions.length - 1) {
        step += 1;
        renderQuestion();
      } else {
        const best = calc();
        result.classList.remove('hidden');
        result.innerHTML = `<p class="text-sm mb-2">Recomendação personalizada:</p>
          <h3 class="text-2xl font-black mb-2">${best.label}</h3>
          <p class="mb-4">Com base nas suas respostas, este é o melhor perfil para si.</p>
          <a href="${best.href}" class="inline-flex items-center justify-center rounded-full bg-[#153E4D] text-white h-11 px-6 font-bold">Ver carros recomendados</a>`;
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });

    renderQuestion();
  </script>
</body>
</html>
