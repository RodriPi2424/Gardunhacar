<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Importar Carro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Manrope", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-slate-500">Autenticar Admin</p>
        <h1 class="text-xl md:text-2xl font-extrabold">Importar Carro</h1>
      </div>
      <a href="admin.html" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-slate-100">
        Voltar ao painel
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <form id="carImportForm" class="space-y-6">
      <section class="bg-white rounded-2xl border border-slate-200 p-5 md:p-6">
        <h2 class="text-lg font-bold mb-4">Dados principais</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block">
            <span class="text-sm font-semibold text-slate-600">Marca</span>
            <input required type="text" name="brand" class="mt-1 block w-full rounded-xl border-slate-300" placeholder="Ex: BMW" />
          </label>
          <label class="block">
            <span class="text-sm font-semibold text-slate-600">Modelo</span>
            <input required type="text" name="model" class="mt-1 block w-full rounded-xl border-slate-300" placeholder="Ex: Série 3" />
          </label>
          <label class="block">
            <span class="text-sm font-semibold text-slate-600">Ano</span>
            <input required type="number" name="year" min="1950" max="2100" class="mt-1 block w-full rounded-xl border-slate-300" placeholder="2023" />
          </label>
          <label class="block">
            <span class="text-sm font-semibold text-slate-600">Preço (EUR)</span>
            <input required type="number" name="price" step="0.01" min="0" class="mt-1 block w-full rounded-xl border-slate-300" placeholder="19990.00" />
          </label>
          <label class="block md:col-span-2">
            <span class="text-sm font-semibold text-slate-600">Descrição</span>
            <textarea name="description" rows="4" class="mt-1 block w-full rounded-xl border-slate-300" placeholder="Condição, histórico, observações..."></textarea>
          </label>
        </div>
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 p-5 md:p-6">
        <h2 class="text-lg font-bold mb-4">Extras</h2>
        <p class="text-sm text-slate-500 mb-3">Adiciona os extras do carro (AC, GPS, câmara traseira, etc).</p>
        <div class="flex flex-col md:flex-row gap-3">
          <input id="extraInput" type="text" class="flex-1 rounded-xl border-slate-300" placeholder="Escreve um extra e clica em adicionar" />
          <button id="addExtraBtn" type="button" class="rounded-xl bg-slate-900 text-white font-semibold px-4 py-2 hover:bg-slate-800">Adicionar extra</button>
        </div>
        <div id="extrasList" class="mt-4 flex flex-wrap gap-2"></div>
        <input id="extrasHidden" type="hidden" name="extras" />
      </section>

      <section class="bg-white rounded-2xl border border-slate-200 p-5 md:p-6">
        <h2 class="text-lg font-bold mb-4">Upload de imagens</h2>
        <label class="block">
          <span class="text-sm font-semibold text-slate-600">Imagens do carro</span>
          <input id="imageInput" type="file" name="images" accept="image/*" multiple class="mt-2 block w-full text-sm file:mr-3 file:rounded-lg file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:font-semibold hover:file:bg-slate-200" />
        </label>
        <p class="mt-2 text-xs text-slate-500">Podes selecionar várias imagens.</p>
        <div id="previewGrid" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3"></div>
      </section>

      <div class="flex items-center gap-3">
        <button type="submit" class="rounded-xl bg-emerald-600 text-white font-bold px-5 py-3 hover:bg-emerald-700">
          Importar carro
        </button>
        <button type="reset" class="rounded-xl border border-slate-300 font-semibold px-5 py-3 hover:bg-slate-100">
          Limpar
        </button>
      </div>
    </form>
  </main>

  <script>
    const extraInput = document.getElementById("extraInput");
    const addExtraBtn = document.getElementById("addExtraBtn");
    const extrasList = document.getElementById("extrasList");
    const extrasHidden = document.getElementById("extrasHidden");
    const imageInput = document.getElementById("imageInput");
    const previewGrid = document.getElementById("previewGrid");
    const form = document.getElementById("carImportForm");
    const extras = [];

    function renderExtras() {
      extrasList.innerHTML = "";
      extras.forEach((extra, index) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-sm font-semibold hover:bg-slate-200";
        chip.innerHTML = `<span>${extra}</span><span aria-hidden="true">x</span>`;
        chip.addEventListener("click", () => {
          extras.splice(index, 1);
          renderExtras();
        });
        extrasList.appendChild(chip);
      });
      extrasHidden.value = JSON.stringify(extras);
    }

    function addExtra() {
      const value = extraInput.value.trim();
      if (!value || extras.includes(value)) return;
      extras.push(value);
      extraInput.value = "";
      renderExtras();
    }

    addExtraBtn.addEventListener("click", addExtra);
    extraInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addExtra();
      }
    });

    imageInput.addEventListener("change", () => {
      previewGrid.innerHTML = "";
      Array.from(imageInput.files || []).forEach((file) => {
        const wrapper = document.createElement("div");
        wrapper.className = "overflow-hidden rounded-xl border border-slate-200 bg-white";

        const img = document.createElement("img");
        img.className = "h-28 w-full object-cover";
        img.src = URL.createObjectURL(file);
        img.alt = file.name;
        img.onload = () => URL.revokeObjectURL(img.src);

        const label = document.createElement("p");
        label.className = "p-2 text-xs text-slate-600 truncate";
        label.textContent = file.name;

        wrapper.appendChild(img);
        wrapper.appendChild(label);
        previewGrid.appendChild(wrapper);
      });
    });

    form.addEventListener("reset", () => {
      extras.length = 0;
      renderExtras();
      previewGrid.innerHTML = "";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const imageCount = (imageInput.files || []).length;
      alert(`Carro pronto para importação.\n\n${data.brand} ${data.model} (${data.year})\nPreço: €${data.price}\nExtras: ${extras.length}\nImagens: ${imageCount}`);
    });
  </script>
</body>
</html>
