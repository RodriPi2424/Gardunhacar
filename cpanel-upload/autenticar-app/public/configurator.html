<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autenticar Configurator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#111111',
            muted: '#666666',
            line: '#e5e5e5',
            paper: '#ffffff',
            cloud: '#f7f7f7'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          },
          boxShadow: {
            soft: '0 20px 60px rgba(17, 17, 17, 0.08)'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: light;
      --hero-height: 70vh;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111111;
    }
    .config-shell {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(17,17,17,0.04), transparent 28%),
        linear-gradient(180deg, #fcfcfc 0%, #f7f7f7 100%);
      overflow: hidden;
    }
    .hero-layout {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .showroom-backdrop {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(118deg, rgba(255,255,255,0.92) 0%, rgba(245,245,245,0.8) 42%, rgba(232,232,232,0.72) 100%),
        linear-gradient(120deg, transparent 0%, transparent 60%, rgba(17,17,17,0.04) 60%, rgba(17,17,17,0.04) 66%, transparent 66%),
        linear-gradient(180deg, rgba(17,17,17,0.03), transparent 34%);
      overflow: hidden;
    }
    .showroom-architecture {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(90deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.82) 45%, rgba(255,255,255,0.2) 100%), url('./hero-autenticar.png');
      background-position: left center, right center;
      background-size: auto, cover;
      background-repeat: no-repeat;
      opacity: 0.24;
      filter: grayscale(1) saturate(0.2) contrast(0.94);
      mix-blend-mode: multiply;
    }
    .showroom-backdrop::before,
    .showroom-backdrop::after {
      content: '';
      position: absolute;
      inset: auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(226,226,226,0.45));
      filter: blur(0.2px);
    }
    .showroom-backdrop::before {
      right: 13%;
      top: -12%;
      width: 120px;
      height: 120%;
      transform: skewX(-36deg);
      opacity: 0.55;
    }
    .showroom-backdrop::after {
      left: 0;
      right: 0;
      bottom: 9%;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(17,17,17,0.12), transparent);
      opacity: 0.7;
    }
    .vehicle-stage {
      filter: drop-shadow(0 34px 40px rgba(17, 17, 17, 0.16));
      animation: vehicleReveal 900ms cubic-bezier(.22,1,.36,1) both;
      transform-origin: center bottom;
    }
    .vehicle-stage img {
      width: 100%;
      height: auto;
      display: block;
    }
    .vehicle-shadow {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: min(50vw, 760px);
      height: 44px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(17,17,17,0.18) 0%, rgba(17,17,17,0.12) 32%, rgba(17,17,17,0.03) 72%, transparent 100%);
      filter: blur(12px);
      pointer-events: none;
    }
    .config-panel {
      box-shadow: 0 -8px 40px rgba(17,17,17,0.03);
    }
    .swatch,
    .wheel-option,
    .config-button {
      transition: transform 220ms ease, border-color 220ms ease, background-color 220ms ease, color 220ms ease, box-shadow 220ms ease, opacity 220ms ease;
    }
    .swatch:hover,
    .wheel-option:hover,
    .config-button:hover {
      transform: translateY(-1px);
    }
    .wheel-svg {
      width: 74px;
      height: 74px;
    }
    .stat-value {
      letter-spacing: -0.04em;
    }
    @keyframes vehicleReveal {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @media (max-width: 1024px) {
      :root { --hero-height: auto; }
      .showroom-backdrop::before { right: 8%; width: 90px; }
      .showroom-architecture {
        background-image: linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.78) 38%, rgba(255,255,255,0.38) 100%), url('./hero-autenticar.png');
        background-position: center top, 74% center;
        opacity: 0.2;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .vehicle-stage,
      .swatch,
      .wheel-option,
      .config-button {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

<body>
  <div id="app"></div>
  <script type="module" src="./configurator.js"></script>
</body>
</html>
